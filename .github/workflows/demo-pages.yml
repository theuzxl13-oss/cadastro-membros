# Publica a PRÉVIA DE DEMONSTRAÇÃO (dados fictícios, sem banco) no GitHub Pages.
# Não afeta a produção (Cloudflare Pages + Supabase).
name: Demonstração no GitHub Pages

on:
  push:
    branches: [claude/trusting-cerf-dcznqh, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npx vite build --mode demo --base "/${{ github.event.repository.name }}/"
      - run: touch dist-demo/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo
      - id: deploy
        uses: actions/deploy-pages@v4
